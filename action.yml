name: "Upload lockfile to FutureVuls"
description: "Upload a lockfile to FutureVuls through the Public API."
inputs:
  path:
    description: "Path to the lockfile, relative to the workspace."
    required: true
  repoName:
    description: "Prefix added to the path registered in FutureVuls (e.g. owner/repo)."
    required: false
runs:
  using: "docker"
  image: "Dockerfile"
